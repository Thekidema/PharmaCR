<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <section class="py-4">
            <div class="container">
                <div class="row">
                    <div class="col-md-8 offset-md-2">

                        <h2><i class="fas fa-plus"></i> [[#{inventario.salida.titulo}]]</h2>

                        <form th:action="@{/inventario/salida/guardar}" th:object="${salida}" method="post" class="mt-3">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">
                                        
                                        [[#{medicamento.nombre}]] *</label>
                                    
                                    <select class="form-select" 
                                            th:field="*{medicamento.idMedicamento}" 
                                            required>
                                        <option value="">
                                            [[#{accion.seleccione}]]</option>
                                        <option th:each="m : ${medicamentos}"
                                                th:value="${m.idMedicamento}"
                                                th:text="${m.codigo + ' — ' + m.nombre + ' (stock: ' + m.stockActual + ')'}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{inventario.tipo}]] *</label>
                                    <!-- Las opciones salen del enum TipoSalida, no escritas a mano -->
                                    <select class="form-select" th:field="*{tipo}" required="true">
                                        <option value="">[[#{accion.seleccione}]]</option>
                                        <option th:each="t : ${T(com.pharmacr.domain.TipoSalida).values()}"
                                                th:value="${t}" th:text="#{'inventario.tipo.' + ${t}}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">
                                        [[#{inventario.cantidad}]] *</label>
                                    <input type="number" class="form-control" th:field="*{cantidad}"
                                           placeholder="Ej: 2" min="1" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">
                                        
                                        [[#{inventario.registradoPor}]]</label>
                                    <!-- El responsable es siempre el usuario autenticado -->
                                    <input type="text" class="form-control" readonly="readonly"
                                           th:value="${#authentication.name}"/>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    
                                    [[#{inventario.motivo}]] *</label>
                                
                                <input type="text" class="form-control" th:field="*{motivo}"
                                       placeholder="Ej: Ajuste por diferencia en conteo físico" maxlength="300" required/>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary me-2">
                                    <i class="fas fa-save"></i> 
                                    
                                    [[#{accion.agregar}]]
                                </button>
                                
                                <a th:href="@{/inventario/salida/listado}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i>
                                    
                                    [[#{accion.cancelar}]]
                                </a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
