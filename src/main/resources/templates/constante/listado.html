<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <section class="py-4">
            <div class="container">

                <h2><i class="fas fa-sliders"></i> [[#{constante.listado}]]</h2>
                <p class="text-muted">[[#{constante.descripcion}]]</p>

                <div class="row">
                    <section th:replace="~{constante/fragmentos :: agregar}"></section>
                    <section th:replace="~{constante/fragmentos :: listado}"></section>
                </div>

            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
