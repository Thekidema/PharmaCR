<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow border-danger">
                        <div class="card-header bg-danger text-white text-center">
                            <h4><i class="fas fa-ban"></i> [[#{e403.titulo}]]</h4>
                        </div>
                        <div class="card-body text-center">
                            <p class="lead">[[#{e403.texto}]]</p>
                            <a th:href="@{/}" class="btn btn-primary">
                                <i class="fas fa-house"></i> [[#{accion.regresar}]]</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
